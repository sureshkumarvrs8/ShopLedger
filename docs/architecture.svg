<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger architecture and order placement flow</title>
  <desc id="desc">Architecture map showing browser UI, Express server and routers, business modules, JSON persistence, and numbered order placement flow. Invoice and tax modules are highlighted.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#64748b"/></marker>
    <marker id="flowArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563eb"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}
      .title{font-size:25px;font-weight:700}.subtitle{font-size:14px;fill:#526176}
      .head{font-size:15px;font-weight:700}.body{font-size:13px}.small{font-size:12px;fill:#526176}
      .box{fill:#fff;stroke:#94a3b8;stroke-width:1.5}.group{fill:#f8fafc;stroke:#cbd5e1;stroke-width:1.5}
      .ticket{fill:#fff7ed;stroke:#f59e0b;stroke-width:2}.flow{fill:none;stroke:#2563eb;stroke-width:2.2;marker-end:url(#flowArrow)}
      .link{fill:none;stroke:#64748b;stroke-width:1.5;marker-end:url(#arrow)}
      .dash{stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#f1f5f9"/>
  <text x="32" y="42" class="title">ShopLedger | Application architecture</text>
  <text x="32" y="66" class="subtitle">Express POS · Khata ledger · GST invoicing · local JSON persistence</text>

  <!-- Primary architecture areas -->
  <rect x="28" y="92" width="205" height="238" rx="12" class="group"/>
  <text x="44" y="119" class="head">Browser UI · public/</text>
  <rect x="45" y="137" width="171" height="72" rx="8" class="box"/>
  <text x="58" y="160" class="head">index.html</text><text x="58" y="181" class="body">POS, orders, Khata, GST</text>
  <rect x="45" y="222" width="171" height="83" rx="8" class="box"/>
  <text x="58" y="245" class="head">js/app.js</text><text x="58" y="266" class="body">loadProducts()</text><text x="58" y="286" class="body">updateCartPreview()</text>
  <text x="45" y="322" class="small">css/style.css styles the UI</text>

  <rect x="262" y="92" width="190" height="238" rx="12" class="group"/>
  <text x="278" y="119" class="head">Express entry point</text>
  <rect x="280" y="143" width="154" height="88" rx="8" class="box"/>
  <text x="297" y="169" class="head">server.js</text><text x="297" y="190" class="body">JSON body parsing</text><text x="297" y="210" class="body">serves public/ + routes</text>
  <rect x="280" y="247" width="154" height="57" rx="8" class="box"/>
  <text x="297" y="270" class="head">config.js</text><text x="297" y="290" class="body">GST, coupons, shop</text>

  <rect x="482" y="92" width="300" height="238" rx="12" class="group"/>
  <text x="498" y="119" class="head">Routers · routes/ (mounted at /api)</text>
  <rect x="500" y="137" width="125" height="72" rx="8" class="box"/><text x="512" y="160" class="head">orders.js</text><text x="512" y="182" class="body">POST /orders</text><text x="512" y="200" class="small">cancel, lookup</text>
  <rect x="638" y="137" width="125" height="72" rx="8" class="box"/><text x="650" y="160" class="head">products.js</text><text x="650" y="182" class="body">products, coupons</text>
  <rect x="500" y="222" width="125" height="72" rx="8" class="box"/><text x="512" y="245" class="head">customers.js</text><text x="512" y="267" class="body">Khata, settlement</text>
  <rect x="638" y="222" width="125" height="72" rx="8" class="box"/><text x="650" y="245" class="head">reports.js</text><text x="650" y="267" class="body">preview, reports</text>

  <rect x="812" y="92" width="174" height="238" rx="12" class="group"/>
  <text x="828" y="119" class="head">Persistent data</text>
  <rect x="830" y="146" width="138" height="86" rx="8" class="box"/>
  <text x="843" y="172" class="head">data/db.json</text><text x="843" y="194" class="body">products · orders</text><text x="843" y="214" class="body">customers · audit</text>
  <text x="830" y="262" class="body">lib/store.js</text><text x="830" y="282" class="small">read() / write()</text>
  <text x="830" y="308" class="small">sync whole-file JSON</text>

  <rect x="1016" y="92" width="156" height="238" rx="12" class="group"/>
  <text x="1032" y="119" class="head">Invoice view</text>
  <rect x="1032" y="145" width="124" height="94" rx="8" class="ticket"/>
  <text x="1045" y="170" class="head">lib/invoice.js</text><text x="1045" y="192" class="body">computeInvoice</text><text x="1045" y="212" class="body">Figures() · render()</text>
  <text x="1032" y="267" class="body">GET /orders/:id/</text><text x="1032" y="286" class="body">invoice in server.js</text>
  <text x="1032" y="310" class="small">Printable HTML</text>

  <!-- Architecture relationships -->
  <path d="M233 180 H280" class="link"/><text x="238" y="169" class="small">HTTP</text>
  <path d="M434 186 H500" class="link"/><text x="440" y="174" class="small">mounts</text>
  <path d="M434 275 C590 360 760 360 830 216" class="link dash"/>
  <path d="M434 160 C650 75 920 75 1032 162" class="link dash"/>
  <path d="M763 173 C792 173 800 173 830 173" class="link"/>
  <path d="M763 258 C798 258 802 258 830 258" class="link"/>
  <path d="M986 187 H1032" class="link"/>

  <!-- Numbered checkout flow -->
  <rect x="28" y="360" width="1144" height="104" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="45" y="385" class="head" fill="#1d4ed8">Order placement · numbered request path</text>
  <g>
    <circle cx="65" cy="421" r="15" fill="#2563eb"/><text x="61" y="426" font-size="14" font-weight="700" fill="#fff">1</text>
    <text x="88" y="417" class="body">UI submits cart</text><text x="88" y="437" class="small">app.js → POST</text>
    <path d="M200 421 H232" class="flow"/>
    <circle cx="255" cy="421" r="15" fill="#2563eb"/><text x="251" y="426" font-size="14" font-weight="700" fill="#fff">2</text>
    <text x="278" y="417" class="body">orders.js resolves</text><text x="278" y="437" class="small">products + quantities</text>
    <path d="M412 421 H444" class="flow"/>
    <circle cx="467" cy="421" r="15" fill="#2563eb"/><text x="463" y="426" font-size="14" font-weight="700" fill="#fff">3</text>
    <text x="490" y="417" class="body">inventory.check()</text><text x="490" y="437" class="small">reject insufficient stock</text>
    <path d="M644 421 H676" class="flow"/>
    <circle cx="699" cy="421" r="15" fill="#2563eb"/><text x="695" y="426" font-size="14" font-weight="700" fill="#fff">4</text>
    <text x="722" y="417" class="body">pricing + coupons</text><text x="722" y="437" class="small">GST from tax.js</text>
    <path d="M850 421 H882" class="flow"/>
    <circle cx="905" cy="421" r="15" fill="#2563eb"/><text x="901" y="426" font-size="14" font-weight="700" fill="#fff">5</text>
    <text x="928" y="417" class="body">Khata? → ledger</text><text x="928" y="437" class="small">charge credit if selected</text>
    <path d="M1060 421 H1080" class="flow"/>
    <circle cx="1102" cy="421" r="15" fill="#2563eb"/><text x="1098" y="426" font-size="14" font-weight="700" fill="#fff">6</text>
    <text x="1124" y="417" class="small">add</text><text x="1124" y="437" class="small">write</text>
  </g>
  <text x="45" y="455" class="small">6 = orders.add() → store.write(db.json); inventory.reserve() and audit append occur before the write.</text>

  <!-- Library map -->
  <text x="32" y="502" class="head">Business modules · lib/</text>
  <rect x="28" y="518" width="1144" height="204" rx="12" class="group"/>
  <rect x="48" y="540" width="202" height="68" rx="8" class="ticket"/>
  <text x="63" y="565" class="head">tax.js · checkout GST</text><text x="63" y="587" class="body">getRateForItem() · slabs</text>
  <rect x="270" y="540" width="202" height="68" rx="8" class="box"/>
  <text x="285" y="565" class="head">pricing.js</text><text x="285" y="587" class="body">subtotal() · computeTotals()</text>
  <rect x="492" y="540" width="202" height="68" rx="8" class="box"/>
  <text x="507" y="565" class="head">coupons.js</text><text x="507" y="587" class="body">validate() · calculateDiscount()</text>
  <rect x="714" y="540" width="202" height="68" rx="8" class="box"/>
  <text x="729" y="565" class="head">inventory.js</text><text x="729" y="587" class="body">check() · reserve() · release()</text>
  <rect x="936" y="540" width="202" height="68" rx="8" class="box"/>
  <text x="951" y="565" class="head">orders.js</text><text x="951" y="587" class="body">add() · get() · cancel() · list()</text>
  <rect x="48" y="626" width="202" height="68" rx="8" class="box"/>
  <text x="63" y="651" class="head">ledger.js</text><text x="63" y="673" class="body">Khata balances · settlements</text>
  <rect x="270" y="626" width="202" height="68" rx="8" class="box"/>
  <text x="285" y="651" class="head">reports.js</text><text x="285" y="673" class="body">dashboard · GST reconciliation</text>
  <rect x="492" y="626" width="202" height="68" rx="8" class="ticket"/>
  <text x="507" y="651" class="head">invoice.js · ticket focus</text><text x="507" y="673" class="body">computeInvoiceFigures() · render()</text>
  <rect x="714" y="626" width="202" height="68" rx="8" class="box"/>
  <text x="729" y="651" class="head">store.js</text><text x="729" y="673" class="body">read() · write() · appendAudit()</text>
  <rect x="936" y="626" width="202" height="68" rx="8" class="box"/>
  <text x="951" y="651" class="head">dates.js</text><text x="951" y="673" class="body">today() · date helpers</text>

  <!-- Flow callouts and legend -->
  <path d="M598 464 C598 500 380 504 380 540" class="flow dash"/>
  <path d="M376 608 V626" class="link"/>
  <path d="M815 608 C815 615 815 617 815 626" class="link"/>
  <path d="M1037 608 C1037 615 1037 617 1037 626" class="link"/>
  <rect x="28" y="741" width="20" height="20" rx="4" class="ticket"/>
  <text x="58" y="756" class="body">Ticket focus: invoice recomputes printable figures; tax.js is highlighted because checkout pricing calls its HSN GST logic.</text>
  <rect x="955" y="735" width="217" height="38" rx="8" fill="#fff" stroke="#cbd5e1"/>
  <rect x="968" y="746" width="16" height="16" rx="3" class="ticket"/><text x="992" y="759" class="small">Highlighted = ticket modules</text>
</svg>
